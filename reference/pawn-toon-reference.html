<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pawn Toon</title>
<style>html,body{margin:0;height:100%;background:#2e231b;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.LinearToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#2e231b');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-2.7, 2.3, 5.2);

// Wood grain: fine, slightly darker wavy streaks (multiplied over the base color)
function grainTexture(seed) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#f2f2f2'; g.fillRect(0, 0, 512, 512);
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++) {
    const x0 = rnd() * 512, amp = 2 + rnd() * 6, freq = 0.004 + rnd() * 0.01, ph = rnd() * 6.28;
    g.strokeStyle = `rgba(60,35,15,${0.04 + rnd() * 0.1})`;
    g.lineWidth = 0.5 + rnd() * 1.8;
    g.beginPath();
    for (let y = -4; y <= 516; y += 8) g.lineTo(x0 + Math.sin(y * freq + ph) * amp, y);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
const wood = (color, rx = 1, ry = 1, seed = 7) => {
  const map = grainTexture(seed); map.repeat.set(rx, ry);
  return new THREE.MeshPhysicalMaterial({
    color, map, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.35,
    sheen: 0.3, sheenRoughness: 0.5, sheenColor: new THREE.Color('#e8b47a')
  });
};

// Pawn profile (radius, height): lipped base, ring, dome, concave stem, thin collar, short neck, ball
const prof = [
  [0, 0], [0.98, 0], [1.02, 0.04], [1.02, 0.12], [0.96, 0.16],
  [0.92, 0.18], [0.95, 0.22], [0.93, 0.28],
  [0.85, 0.36], [0.72, 0.48], [0.58, 0.6],
  [0.48, 0.72], [0.4, 0.9], [0.34, 1.15], [0.3, 1.45], [0.28, 1.75], [0.28, 1.95],
  [0.34, 2.0], [0.58, 2.04], [0.62, 2.09], [0.58, 2.15], [0.34, 2.18],
  [0.26, 2.22], [0.24, 2.28]
];
const pts = prof.map(([r, y]) => new THREE.Vector2(r, y));
const R = 0.55, C = 2.28 + Math.sqrt(R * R - 0.24 * 0.24), t0 = Math.asin((2.28 - C) / R);
for (let i = 1; i <= 40; i++) {
  const t = t0 + (Math.PI / 2 - t0) * (i / 40);
  pts.push(new THREE.Vector2(Math.max(0, R * Math.cos(t)), C + R * Math.sin(t)));
}
const line = new THREE.SplineCurve(pts).getPoints(400);
line[line.length - 1].x = 0;
const geo = new THREE.LatheGeometry(line, 128);
geo.computeVertexNormals();
const pawn = new THREE.Mesh(geo, wood('#d9b07a', 3, 1, 11));
pawn.castShadow = pawn.receiveShadow = true;
pawn.scale.setScalar(0.4);
pawn.position.set(-3.5, 0.003, 2.5); // a2
scene.add(pawn);

const pawnB = new THREE.Mesh(geo, wood('#3a2a22', 3, 1, 13));
pawnB.castShadow = pawnB.receiveShadow = true;
pawnB.scale.setScalar(0.4);
pawnB.position.set(-3.5, 0.003, -2.5); // a7, mirrors a2
pawnB.rotation.y = Math.PI;
scene.add(pawnB);

// Light rook on a1: pawn base, taller stem, wider collar, turret with 4 merlons (4 notches)
{
  const V = ([r, y]) => new THREE.Vector2(r, y);
  const body = [
    [0, 0], [0.98, 0], [1.02, 0.04], [1.02, 0.12], [0.96, 0.16],
    [0.92, 0.18], [0.95, 0.22], [0.93, 0.28],
    [0.85, 0.36], [0.72, 0.48], [0.62, 0.58],
    [0.56, 0.72], [0.5, 1.05], [0.46, 1.5], [0.45, 2.0], [0.46, 2.4],
    [0.56, 2.45], [0.74, 2.49], [0.78, 2.56], [0.74, 2.63], [0.56, 2.66],
    [0.5, 2.72], [0.52, 2.88], [0.58, 3.02], [0.62, 3.2]
  ].map(V);
  const line = new THREE.SplineCurve(body).getPoints(300)
    .concat([[0.62, 3.42], [0.42, 3.42], [0.42, 3.34], [0, 3.34]].map(V));
  const rgeo = new THREE.LatheGeometry(line, 128);
  rgeo.computeVertexNormals();
  const rmat = wood('#d9b07a', 3, 1, 17);
  const rook = new THREE.Group();
  const rb = new THREE.Mesh(rgeo, rmat);
  rb.castShadow = rb.receiveShadow = true;
  rook.add(rb);
  const ro = 0.62, ri = 0.42, span = (Math.PI / 2) * 0.6;
  for (let i = 0; i < 4; i++) {
    const a0 = i * Math.PI / 2 - span / 2, a1 = a0 + span;
    const sh = new THREE.Shape();
    sh.absarc(0, 0, ro, a0, a1, false);
    sh.lineTo(Math.cos(a1) * ri, Math.sin(a1) * ri);
    sh.absarc(0, 0, ri, a1, a0, true);
    sh.closePath();
    const mg = new THREE.ExtrudeGeometry(sh, { depth: 0.24, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015, bevelSegments: 3, curveSegments: 24 });
    mg.rotateX(-Math.PI / 2);
    mg.translate(0, 3.42 + 0.02, 0);
    const m = new THREE.Mesh(mg, rmat);
    m.castShadow = m.receiveShadow = true;
    rook.add(m);
  }
  rook.scale.setScalar(0.4);
  rook.position.set(-3.5, 0.003, 3.5); // a1
  rook.rotation.y = Math.PI / 4;
  scene.add(rook);
}

// ---------- Remaining pieces (starting position) ----------
{
  const V = ([r, y]) => new THREE.Vector2(r, y);
  const B = [[0, 0], [0.98, 0], [1.02, 0.04], [1.02, 0.12], [0.96, 0.16], [0.92, 0.18], [0.95, 0.22], [0.93, 0.28], [0.85, 0.36], [0.72, 0.48]];
  const lathe = (pts, tail = []) => {
    const line = new THREE.SplineCurve(pts.map(V)).getPoints(300).concat(tail.map(V));
    line[line.length - 1].x = 0;
    const g = new THREE.LatheGeometry(line, 128);
    g.computeVertexNormals();
    return g;
  };
  const lightMat = wood('#d9b07a', 3, 1, 21), darkMat = wood('#3a2a22', 3, 1, 23);
  const mesh = (g, m) => { const o = new THREE.Mesh(g, m); o.castShadow = o.receiveShadow = true; return o; };

  // Rook (same build as a1)
  const rookBody = lathe(B.concat([[0.62, 0.58], [0.56, 0.72], [0.5, 1.05], [0.46, 1.5], [0.45, 2.0], [0.46, 2.4],
    [0.56, 2.45], [0.74, 2.49], [0.78, 2.56], [0.74, 2.63], [0.56, 2.66], [0.5, 2.72], [0.52, 2.88], [0.58, 3.02], [0.62, 3.2]]),
    [[0.62, 3.42], [0.42, 3.42], [0.42, 3.34], [0, 3.34]]);
  const merlons = [];
  for (let i = 0; i < 4; i++) {
    const span = (Math.PI / 2) * 0.6, a0 = i * Math.PI / 2 - span / 2, a1 = a0 + span;
    const sh = new THREE.Shape();
    sh.absarc(0, 0, 0.62, a0, a1, false);
    sh.lineTo(Math.cos(a1) * 0.42, Math.sin(a1) * 0.42);
    sh.absarc(0, 0, 0.42, a1, a0, true);
    sh.closePath();
    const mg = new THREE.ExtrudeGeometry(sh, { depth: 0.24, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015, bevelSegments: 3, curveSegments: 24 });
    mg.rotateX(-Math.PI / 2); mg.translate(0, 3.44, 0);
    merlons.push(mg);
  }
  const makeRook = m => { const g = new THREE.Group(); g.add(mesh(rookBody, m)); merlons.forEach(x => g.add(mesh(x, m))); g.rotation.y = Math.PI / 4; return g; };

  // Bishop: slim stem, collar, egg-shaped mitre, small finial (top ~3.58)
  const bishopGeo = lathe(B.concat([[0.6, 0.6], [0.5, 0.78], [0.42, 1.1], [0.37, 1.5], [0.35, 1.9], [0.36, 2.15],
    [0.46, 2.2], [0.62, 2.24], [0.65, 2.3], [0.62, 2.36], [0.44, 2.39], [0.32, 2.44],
    [0.36, 2.52], [0.44, 2.66], [0.46, 2.82], [0.42, 2.98], [0.32, 3.14], [0.18, 3.26], [0.1, 3.3],
    [0.12, 3.34], [0.13, 3.42], [0.1, 3.5], [0.05, 3.56], [0, 3.58]]));
  const makeBishop = m => { const g = new THREE.Group(); g.add(mesh(bishopGeo, m)); return g; };

  // Queen: tall stem, collar, flared coronet with 8 beads, ball finial (top ~4.18)
  const queenGeo = lathe(B.concat([[0.62, 0.6], [0.52, 0.8], [0.44, 1.2], [0.38, 1.7], [0.35, 2.2], [0.36, 2.6],
    [0.48, 2.65], [0.66, 2.7], [0.7, 2.77], [0.66, 2.84], [0.46, 2.88], [0.36, 2.94],
    [0.38, 3.1], [0.46, 3.3], [0.58, 3.5], [0.62, 3.58]]),
    [[0.6, 3.62], [0.46, 3.62], [0.4, 3.66], [0.3, 3.74], [0.16, 3.79], [0, 3.8]]);
  const bead = new THREE.SphereGeometry(0.08, 24, 16), ball = new THREE.SphereGeometry(0.2, 40, 24);
  const makeQueen = m => {
    const g = new THREE.Group(); g.add(mesh(queenGeo, m));
    for (let i = 0; i < 8; i++) { const b = mesh(bead, m), a = i * Math.PI / 4; b.position.set(Math.cos(a) * 0.56, 3.66, Math.sin(a) * 0.56); g.add(b); }
    const t = mesh(ball, m); t.position.y = 3.96; g.add(t);
    return g;
  };

  // King: tallest stem, collar, crown, rounded cross (top ~4.62)
  const kingGeo = lathe(B.concat([[0.62, 0.6], [0.53, 0.8], [0.46, 1.2], [0.4, 1.8], [0.37, 2.3], [0.38, 2.7],
    [0.5, 2.75], [0.7, 2.8], [0.74, 2.87], [0.7, 2.94], [0.48, 2.98], [0.38, 3.04],
    [0.42, 3.2], [0.52, 3.42], [0.58, 3.6], [0.58, 3.66]]),
    [[0.5, 3.7], [0.36, 3.76], [0.2, 3.8], [0, 3.82]]);
  const crossV = new RoundedBoxGeometry(0.17, 0.8, 0.17, 3, 0.05), crossH = new RoundedBoxGeometry(0.5, 0.17, 0.17, 3, 0.05);
  const makeKing = m => {
    const g = new THREE.Group(); g.add(mesh(kingGeo, m));
    const v = mesh(crossV, m); v.position.y = 4.22; const h = mesh(crossH, m); h.position.y = 4.34;
    g.add(v, h); return g;
  };

  // Knight: turned pedestal + extruded, beveled horse-head profile (top ~3.45)
  const knightBase = lathe(B.concat([[0.64, 0.58], [0.6, 0.66], [0.62, 0.74]]), [[0.5, 0.8], [0, 0.8]]);
  const head = new THREE.Shape();
  [[-0.55, 0], [0.55, 0], [0.5, 0.4], [0.38, 0.8], [0.45, 1.1], [0.72, 1.48], [0.95, 1.72], [1.0, 1.92], [0.86, 2.08],
   [0.5, 2.28], [0.3, 2.48], [0.2, 2.66], [0.06, 2.52], [-0.12, 2.58], [-0.24, 2.4], [-0.5, 2.05], [-0.62, 1.5], [-0.6, 0.9], [-0.55, 0.4]]
    .forEach(([x, y], i) => i ? head.lineTo(x, y) : head.moveTo(x, y));
  head.closePath();
  const headGeo = new THREE.ExtrudeGeometry(head, { depth: 0.56, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.08, bevelSegments: 4 });
  headGeo.translate(0, 0.74, -0.28);
  headGeo.computeVertexNormals();
  const makeKnight = m => { const g = new THREE.Group(); g.add(mesh(knightBase, m)); const hd = mesh(headGeo, m); hd.rotation.y = Math.PI / 2; g.add(hd); return g; };

  const makers = { R: makeRook, N: makeKnight, B: makeBishop, Q: makeQueen, K: makeKing, P: m => mesh(geo, m) };
  const place = (obj, f, r, dark) => {
    const wrap = new THREE.Group();
    wrap.add(obj);
    wrap.scale.setScalar(0.4);
    wrap.position.set(f - 3.5, 0.003, 3.5 - r);
    if (dark) wrap.rotation.y = Math.PI;
    scene.add(wrap);
  };
  const order = 'RNBQKBNR';
  for (let f = 0; f < 8; f++) {
    if (f !== 0) place(makers[order[f]](lightMat), f, 0, false); // a1 rook already placed
    if (f !== 0) place(makers.P(lightMat), f, 1, false);         // a2 pawn already placed
    if (f !== 0) place(makers.P(darkMat), f, 6, true);           // a7 pawn already placed
    place(makers[order[f]](darkMat), f, 7, true);
  }

  // Broad lighter-walnut rim from the far side keeps the dark set readable on dark squares
  const rimAll = new THREE.DirectionalLight('#c48a55', 0.9);
  rimAll.position.set(0, 4, -10);
  scene.add(rimAll);
}

// Lighter-walnut rim from behind the black pawn keeps its silhouette readable on dark squares
const rimB = new THREE.SpotLight('#c48a55', 6, 8, Math.PI / 7, 0.6, 1.5);
rimB.position.set(-3.5, 2.2, -5.2);
rimB.target = pawnB;
scene.add(rimB);

// Board
const sqGeo = new THREE.BoxGeometry(1, 0.12, 1);
const lightMat = wood('#d9b07a', 1, 1, 3), darkMat = wood('#3a2a22', 1, 1, 5);
for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++) {
  const sq = new THREE.Mesh(sqGeo, (f + r) % 2 === 0 ? darkMat : lightMat); // a1 dark
  sq.position.set(f - 3.5, -0.06, 3.5 - r);
  sq.receiveShadow = true;
  scene.add(sq);
}
const frame = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.34, 9.4), wood('#8a5a32', 4, 1, 9));
frame.position.y = -0.18;
frame.receiveShadow = true;
scene.add(frame);

// Lights: key from front-left-above so bands sweep across the ball and base
scene.add(new THREE.AmbientLight('#ffffff', 0.2));
const key = new THREE.DirectionalLight('#fff2e0', 1.5);
key.position.set(-6, 9, 6);
key.target = pawn;
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.radius = 4;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
scene.add(key);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-3.5, 0.55, 2.5);
controls.enableDamping = true;
controls.minDistance = 1.5;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
